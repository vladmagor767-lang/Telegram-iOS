```yaml
jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Create OwpenGram configuration
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import json
          import os

          config = {
              "bundle_id": "org.vladmagor767.Swiftgram",
              "api_id": os.environ["API_ID"],
              "api_hash": os.environ["API_HASH"],
              "team_id": "",
              "app_center_id": "0",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
              "sg_config": ""
          }

          with open(
              "build-system/owpengram_ci_configuration.json",
              "w"
          ) as f:
              json.dump(config, f, indent=4)
          PY

      - name: Create canonical source directory
        run: |
          set -eux

          SOURCE_DIR="/Users/Shared/telegram-ios"

          sudo rm -rf "$SOURCE_DIR"
          sudo mkdir -p /Users/Shared

          sudo cp -R "$GITHUB_WORKSPACE" "$SOURCE_DIR"

          sudo chown -R "$(whoami):$(id -g)" "$SOURCE_DIR"

      - name: Build the App
        run: |
          set -eux

          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Xcode:"
          xcodebuild -version
          echo "========================================"
          echo "App version: $APP_VERSION"
          echo "Build number: $BUILD_NUMBER"
          echo "========================================"

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/owpengram_ci_configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="$SOURCE_DIR/build/artifacts"

          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          find bazel-out \
            -type f \
            -path "*/bin/Telegram/Telegram.ipa" \
            -exec cp {} "$OUTPUT_PATH/Telegram.ipa" \;

          if [ ! -f "$OUTPUT_PATH/Telegram.ipa" ]; then
            echo "ERROR: IPA not found"
            find bazel-out -type f -name "*.ipa" -print || true
            exit 1
          fi

          mkdir -p build/DSYMs

          find bazel-out \
            -type d \
            -name "*.dSYM" \
            -exec cp -R {} build/DSYMs/ \;

          cd build

          zip -r \
            "$OUTPUT_PATH/Telegram.DSYMs.zip" \
            DSYMs >/dev/null

          echo "========================================"
          echo "Build completed"
          echo "IPA:"
          ls -lh "$OUTPUT_PATH/Telegram.ipa"
          echo "DSYMs:"
          ls -lh "$OUTPUT_PATH/Telegram.DSYMs.zip"
          echo "========================================"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OwpenGram-Swiftgram-IPA
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error

      - name: Upload DSYMs
        uses: actions/upload-artifact@v4
        with:
          name: OwpenGram-Swiftgram-DSYMs
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: error
```
